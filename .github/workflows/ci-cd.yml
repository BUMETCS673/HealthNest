name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"

  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  validate-jira:
    name: Validate Jira Key
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name contains Jira key
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == release/* ]]; then
            echo "Release branch detected. Skipping Jira branch check."
            exit 0
          fi

          if [[ ! "$BRANCH_NAME" =~ (feature)/[A-Z]+-[0-9]+-.+ ]]; then
            echo "Branch name must follow: feature/SCRUM-XX-short-description"
            exit 1
          fi

      - name: Validate latest commit message contains Jira key
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title }}"
          echo "Commit/PR title: $COMMIT_MSG"

          if [[ ! "$COMMIT_MSG" =~ [A-Z]+-[0-9]+ ]]; then
            echo "Commit message or PR title must include a Jira ticket key like SCRUM-XX"
            exit 1
          fi

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    needs: validate-jira

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        continue-on-error: false

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t healthnest-ai-webapp .

      - name: Validate Docker Compose
        run: docker compose config

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: docker-build

    if: startsWith(github.ref_name, 'release/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production Docker image
        run: docker build -t healthnest-ai-release .

      - name: Validate release compose file
        run: docker compose config
