services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: https://tuujofmwfricjqdhqnsd.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1dWpvZm13ZnJpY2pxZGhxbnNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDA1ODgsImV4cCI6MjA5NDc3NjU4OH0.gyB9-WCPWvmKsOekEujdhFmciAOocBL7HDilzQGPMzU
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      LAB_RESULTS_KEK: ${LAB_RESULTS_KEK}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PULSE_MODEL: gpt-5.2
      PULSE_EMBED_MODEL: text-embedding-3-small
      PULSE_DEIDENTIFY: "false"
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: medapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
