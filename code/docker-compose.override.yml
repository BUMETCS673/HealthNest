services:
  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    environment:
      APP_ENV: development
      UVICORN_WORKERS: "1"
    volumes:
      - ./backend:/app
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-server-header
