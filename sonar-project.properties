sonar.projectKey=HealthNest
sonar.projectName=HealthNest
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src
sonar.tests=backend/tests,backend/ai/tests,frontend/src/__tests__

sonar.exclusions=**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/__pycache__/**,**/.pytest_cache/**,backend/tests/**,backend/ai/tests/**,frontend/src/__tests__/**

sonar.python.version=3.12,3.13

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.coverage.exclusions=\
  backend/tests/**,\
  backend/ai/tests/**,\
  frontend/src/__tests__/**,\
  frontend/src/setupTests.js